# deepseek-homegate bundle patch — one row (host + browser halves).
#
# Install with:
#   dsh plugin --profile web add github:ByungHyun21/deepseek-homegate
# then restart `dsh --profile web`.
#
# The first boot with an empty account store enters bootstrap mode: the login
# page offers creating the first admin account, and that endpoint accepts
# loopback / bind-address requests only. Set `enabled: false` as the escape
# hatch if you ever lock yourself out.

- insert:
    - id: homegate
      name: deepseek-homegate
      config:
        enabled: true
        session:
          cookieName: hg_session
          ttlSeconds: 2592000      # 30 days
          secure: false            # HTTPS deployment -> true
        rateLimit:
          maxAttempts: 8
          windowMs: 900000         # 15 minutes
        # Mint the core's Host-bound `dsh-auth-*` browser cookie after gate
        # login, signed with client-connection's own persisted secret, so
        # /api, the stream WebSocket and the SPA authenticate for remote
        # browsers without ever exposing the launch token.
        browserAuth:
          enabled: true
        # Paired-device remote window plane (/mini): QR pairing grants,
        # per-device roster, authenticated reverse-proxy mirror of the core.
        mini:
          enabled: true
          grantTtlMs: 300000       # 5 minutes per pairing grant
          maxDevices: 10

# Directory picker: force the in-app browse backend. The web surface's auto
# chooser resolves native on loopback-looking binds and pops an OS folder
# dialog on the HOST machine — invisible to a remote browser. (Pattern and
# rationale borrowed from @xgone/dsh-remote.)
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      config:
        maxEntries: 1000
    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
